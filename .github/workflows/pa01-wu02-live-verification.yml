name: PA-01 WU-02 live preview verification

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Exact isolated Vercel Preview URL (https://...vercel.app)"
        required: true
        type: string
      test_mode:
        description: "Select the live test to run"
        required: true
        type: choice
        options:
          - sequential
          - concurrency
          - expiration
          - failclosed
      confirm_isolated_preview:
        description: "Type ISOLATED-NONPROD to confirm the target is an isolated nonproduction deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pa01-wu02-live-verification
  cancel-in-progress: false

jobs:
  live-verification:
    if: github.ref == 'refs/heads/security/pa01-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PA01_PREVIEW_URL: ${{ inputs.preview_url }}
      PA01_CONFIRMATION: ${{ inputs.confirm_isolated_preview }}
      PA01_VERCEL_BYPASS_SECRET: ${{ secrets.PA01_VERCEL_BYPASS_SECRET }}
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify sequential login limiter
        if: inputs.test_mode == 'sequential'
        run: node tests/security/wu02-live-preview.mjs
      - name: Verify concurrent login limiter
        if: inputs.test_mode == 'concurrency'
        run: node tests/security/wu02-live-concurrency.mjs
      - name: Verify 15-minute counter expiration
        if: inputs.test_mode == 'expiration'
        run: node tests/security/wu02-live-expiration.mjs
      - name: Verify fail-closed login with missing Redis configuration
        if: inputs.test_mode == 'failclosed'
        run: node tests/security/wu02-live-failclosed.mjs
